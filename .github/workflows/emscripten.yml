relaxedxed: Emscripten build
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # è relaxed
        simd_config: [standard, relaxed]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: mamba-org/setup-micromamba@v2
        with:
            environment-name: xsimd
            create-args: >-
                microsoft::playwright=1.50.0
                python
            init-shell: bash

      - name: Build script
        shell: bash -el {0}
        run: |
            echo "Building configuration: ${{ matrix.simd_config }}"
            playwright install
            
            # Íàñòðàèâàåì ôëàãè â çàâèñèìîñòè îò ìàòðèöû
            if [ "${{ matrix.simd_config }}" == "relaxed" ]; then
              # Âêëþ÷àåì Relaxed SIMD è Fast Math
              # -msimd128: âêëþ÷àåò áàçîâûé SIMD
              # -mrelaxed-simd: âêëþ÷àåò relaxed èíñòðóêöèè
              # -ffast-math: ðàçðåøàåò îïòèìèçàöèè è îïðåäåëÿåò __FAST_MATH__
              export CXXFLAGS="-msimd128 -mrelaxed-simd -ffast-math"
              export CFLAGS="-msimd128 -mrelaxed-simd -ffast-math"
              
              # Ìîæíî òàêæå ïåðåäàòü ìàêðîñ ÿâíî, åñëè âäðóã êîìïèëÿòîð ñòàðûé, 
              # íî îáû÷íî ôëàãè âûøå äåëàþò ýòî ñàìè.
              echo "Relaxed SIMD enabled. Flags: $CXXFLAGS"
            else
              echo "Standard build."
            fi

            # Çàïóñêàåì èñïðàâëåííûé ñêðèïò
            ./test/test_wasm/test_wasm.sh 4.0.21
